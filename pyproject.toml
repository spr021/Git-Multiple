[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "git-multiple"
version = "2.0.0"
description = "A safe, cross-platform Git identity switcher"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Git Multiple contributors"}]
keywords = ["git", "identity", "account", "cli"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]

[project.scripts]
git-multiple = "git_multiple.cli:main"

[project.urls]
Homepage = "https://github.com/spr021/Git-Multiple"
Issues = "https://github.com/spr021/Git-Multiple/issues"

[tool.setuptools]
packages = ["git_multiple"]
