name: Release standalone applications

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native-build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: git-multiple-linux-x64
            output: dist/git-multiple-linux-x64
          - os: macos-13
            asset: git-multiple-macos-x64
            output: dist/git-multiple-macos-x64
          - os: macos-14
            asset: git-multiple-macos-arm64
            output: dist/git-multiple-macos-arm64
          - os: windows-latest
            asset: git-multiple-windows-x64
            output: dist/git-multiple-windows-x64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests on target OS
        run: python -m unittest discover -v
      - name: Install native application builder
        run: python -m pip install pyinstaller
      - name: Build one-file application
        run: pyinstaller --clean --onefile --name ${{ matrix.asset }} scripts/standalone_entry.py
      - name: Smoke-test native application
        run: python -c "import subprocess; subprocess.run([r'${{ matrix.output }}', '--version'], check=True)"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.output }}
          if-no-files-found: error

  portable-build:
    name: Build portable Python application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_zipapp.py
      - run: python dist/git-multiple.pyz --version
      - uses: actions/upload-artifact@v4
        with:
          name: git-multiple-portable
          path: dist/git-multiple.pyz
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [native-build, portable-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Write SHA-256 checksums
        working-directory: release-assets
        run: sha256sum git-multiple-* > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --generate-notes --verify-tag
